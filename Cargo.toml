[package]
name = "iptv-proxy"
version = "1.0.0"
edition = "2021"
authors = ["IPTV Proxy Team"]

[dependencies]
# pingora 使用 Git 提交 d9e6d7a，已兼容 sfv，无需锁定
pingora = { git = "https://github.com/cloudflare/pingora", rev = "d9e6d7a", default-features = false, features = ["lb", "rustls"] }
pingora-core = { git = "https://github.com/cloudflare/pingora", rev = "d9e6d7a", default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
bytes = "1"
url = "2"
log = "0.4"
env_logger = "0.11"
http = "1"
urlencoding = "2"          # 用于编解码代理 URL

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# 注意：不要使用 panic = "abort"。
# 一旦某个请求的过滤器发生 panic，进程会直接中止，导致所有下游连接瞬间断开，
# 在日志中表现为大量 "Downstream ConnectionClosed ... Prematurely before response ... complete"。
# 保持默认的 unwind：单个请求出错仅影响该连接，不影响其它客户端。

[profile.release.package."*"]
opt-level = 3 
