[package]
name = "iptv-proxy"
version = "2.0.0"
edition = "2021"
authors = ["IPTV Proxy Team"]
description = "IPTV transparent proxy (m3u8 rewrite + media passthrough) built on axum + reqwest, no Pingora"

[dependencies]
# HTTP 服务端（路由 + 流式响应）
axum = "0.7"
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
# 上游 HTTP 客户端：stream 用于分片流式转发、http2 上游兼容。
# TLS 后端按目标区分（见下方 target 段）：
#  - Windows 用 native-tls(schannel)：直接信任 Windows 系统证书库，能过公司/运营商的 TLS 拦截证书，
#    且无需 C 编译器即可在本机编译；
#  - 非 Windows(musl/Linux) 用 rustls-tls：CI 容器自带 gcc，静态链接无 openssl 依赖。
reqwest = { version = "0.12", default-features = false }
# 缓冲
bytes = "1"
# HTTP 类型（axum / reqwest 共用 http crate）
http = "1"
# URL 解析
url = "2"
# 代理 URL 编解码
urlencoding = "2"
# 结构化日志（双写 stderr + 文件，热路径 debug）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# ── 按目标选择 TLS 后端 ─────────────────────────────────────────────────────
# Windows：native-tls(schannel)，直接信任 Windows 系统证书库，无需 C 编译器
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "http2"] }

# 非 Windows（musl/Linux）：rustls-tls 静态链接，无 openssl 依赖
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
