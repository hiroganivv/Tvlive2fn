[package]
name = "iptv-proxy"
version = "2.0.0"
edition = "2021"
authors = ["IPTV Proxy Team"]
description = "IPTV transparent proxy (m3u8 rewrite + media passthrough) built on axum + reqwest, no Pingora"

[dependencies]
# HTTP 服务端（路由 + 流式响应）
axum = "0.7"
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
# 上游 HTTP 客户端：rustls 静态链接（无 openssl）、stream 用于分片流式转发、http2 上游兼容
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
# 缓冲
bytes = "1"
# HTTP 类型（axum / reqwest 共用 http crate）
http = "1"
# URL 解析
url = "2"
# 代理 URL 编解码
urlencoding = "2"
# 结构化日志（双写 stderr + 文件，热路径 debug）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
